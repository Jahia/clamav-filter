# Dependabot configuration.
#
# This file previously shipped as the unmodified GitHub scaffold, with an empty
# `package-ecosystem: ""`. That is not a valid ecosystem, so no version updates
# ever ran. The pull requests that did appear came from the separate repository
# setting "Dependabot security updates", which works off the alert list and does
# not read this file — which is why alerts accumulated one ungrouped PR at a time.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Front-end / build toolchain for the module itself (webpack, jest, eslint, sass).
  # Yarn 1 lockfile — see the `yarnVersion` pinned in frontend-maven-plugin (pom.xml).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      # Nearly every alert here lands on a transitive build-time dependency. Grouping
      # collapses what would otherwise be one PR per package into a single reviewable
      # lockfile bump, for security and version updates alike.
      npm-root:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-root-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Module Federation shared singletons. webpack.config.js feeds package.json to
      # getModuleFederationConfig, so each of these declared ranges becomes a RUNTIME
      # requirement against whatever the Jahia app-shell provides. A webpack build cannot
      # detect a mismatch — it only surfaces at runtime in Jahia — so these must track the
      # target Jahia version and be bumped deliberately, never by a routine dependency PR.
      # Only majors are ignored: a CVE fix normally lands as minor/patch inside the current
      # major, and those still come through (an `ignore` rule suppresses security updates too).
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/moonstone"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/ui-extender"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Babel 8 cannot land alone: @babel/preset-env, @babel/preset-react and babel-jest all
      # peer-depend on @babel/core ^7, and the resolutions entry pins ^7.29.6. Moving to 8
      # means moving all of them together as one deliberate change.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

  # Cypress end-to-end harness (tests/), an independent Yarn 1 workspace.
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      npm-tests:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-tests-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Same Babel 8 coupling as the root workspace.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

  # Java/OSGi side. The parent (org.jahia.modules:jahia-modules) governs most
  # versions, so expect a low PR volume here — mostly test-scoped dependencies.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      maven:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      maven-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # graphql-dxm-provider is `provided` scope: compiling against a newer API than the
      # customer's runtime risks NoSuchMethodError on their instance. Bump it deliberately,
      # alongside a parent bump and a matching e2e run — not via an automated PR.
      #
      # The jahia-modules parent is deliberately NOT ignored: tracking the Jahia baseline is
      # wanted, and the pom now absorbs the two things a parent bump breaks (the compiler
      # release override and the pinned Surefire). Review each parent PR against AGENTS.md
      # "Key Facts" — in particular, diff the bundle's Import-Package header against the
      # previous release, because bnd derives those ranges from the build classpath and a
      # narrowed range stops the module resolving on older Jahia instances.
      - dependency-name: "org.jahia.modules:graphql-dxm-provider"
