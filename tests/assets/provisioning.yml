- karafCommand: "log:log 'START - provisioning'"

# SUPPORT-646 correction (see 06/07/08 pipeline reports): the security-filter bundle
# (org.jahia.bundles.api.security.cfg) protects ALL APIs (GraphQL, RESTful JCR, custom REST,
# views) by default. Its 'security.profile' setting defaults to 'default' ("no API calls from
# external origins or non-privileged users"), which blocks the RESTful JCR-REST calls made by
# 03-clamavFilter-RawBinaryUpload.cy.ts. The block manifests as confusing 404s/500s deep in the
# resource layer (e.g. the paths/{path} resource) rather than a clean 403 at the filter, which is
# what caused an earlier pipeline stage to mistakenly conclude this was a jcrestapi platform
# defect. Setting security.profile=open here (never acceptable for production, fine for this
# disposable test container) removes that block so the spec can actually exercise the filter
# end to end.
- karafCommand: "config:property-set -p org.jahia.bundles.api.security security.profile open"

- karafCommand: "log:log 'START - Install clamav-filter dependencies'"
- installBundle:
      - 'mvn:org.jahia.modules/graphql-dxm-provider/LATEST'
      - 'mvn:org.jahia.modules/serverSettings/LATEST'
  autoStart: true
  uninstallPreviousVersion: false
- karafCommand: "log:log 'END - Install clamav-filter dependencies'"

# Point clamav-filter at the `clamav` compose service BEFORE any spec runs. Without this the
# module keeps its compiled-in default of localhost:3310, where nothing listens, so the filter
# fail-closes and every scanned request answers 503 instead of the 403 the scanning specs assert.
# Doing it here rather than relying on 01-clamavFilter.cy.ts's saveSettings mutation removes a
# cross-spec ordering dependency: 03 and 05 assert scan BEHAVIOUR and must not silently degrade
# into "the daemon was never configured" when a GraphQL call in an unrelated spec fails.
- karafCommand: "config:property-set -p org.jahia.community.clamav host clamav"
- karafCommand: "config:property-set -p org.jahia.community.clamav port 3310"
- karafCommand: "config:property-set -p org.jahia.community.clamav connection_timeout 5000"
- karafCommand: "config:property-set -p org.jahia.community.clamav read_timeout 30000"

- karafCommand: "log:log 'END - provisioning'"
